services:
  pgvector:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: deepagents
      POSTGRES_USER: deepagents
      POSTGRES_PASSWORD: deepagents
    ports:
      - "5433:5432"
    volumes:
      - deepagents-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepagents -d deepagents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deepagents-pgvector-data:
