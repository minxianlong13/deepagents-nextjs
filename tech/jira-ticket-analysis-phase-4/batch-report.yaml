protocol_violation: false
errors: []
warnings:
  - severity: HIGH
    message: Release sign-off requires a real ticket through all steps, live Slack authorization/failure/no-match checks, Pinecone/OpenAI retrieval, RAG Chat and manual comparison with originals.
  - severity: INFO
    message: Source IDs prove internal consistency, not authenticity or entailment; carried state remains client-supplied.
  - severity: INFO
    message: Slack call timeout excludes connection/OAuth establishment; documentation timeout does not guarantee upstream cancellation.
  - severity: INFO
    message: Original carried payloads count toward the request cap and may require restarting with smaller source results.
